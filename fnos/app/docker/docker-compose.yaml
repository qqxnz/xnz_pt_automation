services:
  pta:
    image: crpi-yg64rrvs864jdm4p.cn-shenzhen.personal.cr.aliyuncs.com/qqxnz/xnz-pt-automation:${wizard_image_tag:-0.6.32}
    container_name: pta
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${wizard_service_port:-3180}"
      DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      - ${TRIM_DATA_SHARE_PATHS}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${wizard_service_port:-3180}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
