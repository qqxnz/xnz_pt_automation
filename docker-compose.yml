services:
  xnz-pt-automation:
    image: qqxnz/xnz-pt-automation:0.6.14
    container_name: xnz-pt-automation
    restart: on-failure:5
    ports:
      - "3180:3180"
    environment:
      PORT: "3180"
      DATA_DIR: /data
      DEFAULT_ADMIN_PASSWORD: "123456"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3180/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
