name: Docker Image CI

on:
  push:
    tags: [ "v*" ]

env:
  DOCKER_HUB_IMAGE: qqxnz/xnz-pt-automation
  ALIYUN_REGISTRY: crpi-yg64rrvs864jdm4p.cn-shenzhen.personal.cr.aliyuncs.com
  ALIYUN_IMAGE: crpi-yg64rrvs864jdm4p.cn-shenzhen.personal.cr.aliyuncs.com/qqxnz/xnz-pt-automation

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Login to Aliyun Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ALIYUN_REGISTRY }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        password: ${{ secrets.ALIYUN_PASSWORD }}

    - name: Build and push multi-arch images
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: VERSION=${{ steps.version.outputs.version }}
        tags: |
          ${{ env.DOCKER_HUB_IMAGE }}:latest
          ${{ env.DOCKER_HUB_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.ALIYUN_IMAGE }}:latest
          ${{ env.ALIYUN_IMAGE }}:${{ steps.version.outputs.version }}
        push: true
