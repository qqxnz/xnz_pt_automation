<svg width="1040" height="720" viewBox="0 0 1040 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#111827" flood-opacity="0.16"/></filter>
    <style>.t{font-family:Inter,Arial,sans-serif}.dark{fill:#111827}.muted{fill:#6b7280}.label{font-size:14px;font-weight:800}</style>
  </defs>
  <rect width="1040" height="720" fill="#f6f8fb"/>
  <g filter="url(#shadow)" transform="translate(70 54)">
    <rect width="900" height="612" rx="24" fill="#fff"/>
    <rect width="900" height="82" rx="24" fill="#f8fbff"/>
    <text x="32" y="38" class="t dark" font-size="26" font-weight="800">新增站点</text>
    <text x="32" y="62" class="t muted" font-size="14">保存并测试会执行站点检查和用户统计获取。</text>
    <text x="850" y="52" class="t muted" font-size="28">×</text>
    <g transform="translate(32 118)">
      <text x="0" y="0" class="t dark" font-size="18" font-weight="800">基础信息</text>
      <text x="0" y="42" class="t muted label">站点域名</text>
      <rect x="0" y="54" width="380" height="48" rx="14" fill="#f9fafb" stroke="#dbe4f0"/>
      <text x="18" y="84" class="t muted" font-size="15">pt.m-team.cc</text>
      <rect x="0" y="124" width="20" height="20" rx="5" fill="#3f7cff"/><text x="34" y="140" class="t dark" font-size="15" font-weight="800">启用站点</text>
    </g>
    <g transform="translate(468 118)">
      <text x="0" y="0" class="t dark" font-size="18" font-weight="800">访问凭证</text>
      <text x="0" y="42" class="t muted label">API Key</text>
      <rect x="0" y="54" width="380" height="48" rx="14" fill="#f9fafb" stroke="#dbe4f0"/>
      <text x="18" y="84" class="t muted" font-size="15">已保存，留空不修改</text>
      <text x="0" y="132" class="t muted label">Cookie</text>
      <rect x="0" y="144" width="380" height="48" rx="14" fill="#f9fafb" stroke="#dbe4f0"/>
      <text x="18" y="174" class="t muted" font-size="15">可选，用于 API Key 失败时回退</text>
      <text x="0" y="222" class="t muted label">User-Agent</text>
      <rect x="0" y="234" width="250" height="48" rx="14" fill="#f9fafb" stroke="#dbe4f0"/>
      <text x="18" y="264" class="t muted" font-size="15">当前浏览器 User-Agent</text>
      <rect x="264" y="234" width="116" height="48" rx="14" fill="#eef6ff"/>
      <text x="322" y="264" text-anchor="middle" fill="#2563eb" class="t" font-size="14" font-weight="800">恢复当前</text>
    </g>
    <g transform="translate(32 340)">
      <text x="0" y="0" class="t dark" font-size="18" font-weight="800">代理配置</text>
      <text x="0" y="42" class="t muted label">使用代理</text>
      <rect x="0" y="54" width="380" height="48" rx="14" fill="#f9fafb" stroke="#dbe4f0"/>
      <text x="18" y="84" class="t dark" font-size="15">不使用代理</text>
      <rect x="0" y="126" width="380" height="58" rx="14" fill="#f8fafc"/>
      <text x="18" y="160" class="t muted" font-size="14">代理配置来自代理管理模块。默认不使用代理。</text>
    </g>
    <rect x="0" y="530" width="900" height="1" fill="#e5e7eb"/>
    <text x="32" y="578" class="t muted" font-size="14">校验：域名合法，API Key 和 Cookie 至少填写一个。已知域名自动显示站点显示名。</text>
    <rect x="570" y="552" width="86" height="44" rx="14" fill="#fff" stroke="#dbe4f0"/><text x="613" y="580" text-anchor="middle" class="t dark" font-size="15" font-weight="800">取消</text>
    <rect x="672" y="552" width="118" height="44" rx="14" fill="#eef6ff"/><text x="731" y="580" text-anchor="middle" fill="#2563eb" class="t" font-size="15" font-weight="800">保存并测试</text>
    <rect x="806" y="552" width="62" height="44" rx="14" fill="#3f7cff"/><text x="837" y="580" text-anchor="middle" fill="#fff" class="t" font-size="15" font-weight="800">保存</text>
  </g>
</svg>
