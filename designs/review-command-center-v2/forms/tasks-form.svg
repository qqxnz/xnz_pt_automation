<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280"><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#142033}.muted{fill:#718096}.white{fill:#fff}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.tiny{font-size:10px;letter-spacing:1px}.small{font-size:12px}.label{font-size:13px;font-weight:700}.title{font-size:18px;font-weight:800}</style><rect width="1900" height="1280" fill="#e7edf4"/><text x="20" y="24" class="muted tiny">桌面端：控件状态直接落实到表单</text><text x="1398" y="24" class="muted tiny">移动端：全屏表单与底部选择面板</text><g transform="translate(0 44)"><rect width="1360" height="1210" rx="18" fill="#17263f"/><rect x="145" y="24" width="1070" height="1150" rx="18" fill="#fff"/><text x="181" y="70" class="ink title">新建任务</text><text x="181" y="96" class="muted small">字段状态、选择行为和校验信息均为实际表单内容。</text><text x="1175" y="70" text-anchor="end" class="muted title">×</text><line x1="145" y1="116" x2="1215" y2="116" stroke="#e5ebf2"/><text x="181" y="158" class="ink title">基础配置</text><text x="181" y="196" class="ink label">任务名称<tspan fill="#e05263"> *</tspan></text><rect x="181" y="208" width="260" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="193" y="234" class="ink small">MTeam 免费自动推送</text><text x="470" y="196" class="ink label">执行间隔（分钟）<tspan fill="#e05263"> *</tspan></text><rect x="470" y="208" width="150" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="482" y="234" class="ink small">10</text><text x="650" y="196" class="ink label">站点<tspan fill="#e05263"> *</tspan></text><rect x="650" y="208" width="300" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="2"/><text x="662" y="234" class="ink small">MTeam</text><text x="926" y="235" class="blue title">⌃</text><rect x="650" y="254" width="300" height="150" rx="10" fill="#fff" stroke="#bcd3fb"/><rect x="658" y="262" width="318" height="3