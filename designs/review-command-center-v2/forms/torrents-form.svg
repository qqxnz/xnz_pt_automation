<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280"><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#142033}.muted{fill:#718096}.white{fill:#fff}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.tiny{font-size:10px;letter-spacing:1px}.small{font-size:12px}.label{font-size:13px;font-weight:700}.title{font-size:18px;font-weight:800}</style><rect width="1900" height="1280" fill="#e7edf4"/><text x="20" y="24" class="muted tiny">桌面端：控件状态直接落实到表单</text><text x="1398" y="24" class="muted tiny">移动端：全屏表单与底部选择面板</text><g transform="translate(0 44)"><rect width="1360" height="1210" rx="18" fill="#17263f"/><rect x="145" y="24" width="1070" height="1150" rx="18" fill="#fff"/><text x="181" y="70" class="ink title">修改下载器</text><text x="181" y="96" class="muted small">字段状态、选择行为和校验信息均为实际表单内容。</text><text x="1175" y="70" text-anchor="end" class="muted title">×</text><line x1="145" y1="116" x2="1215" y2="116" stroke="#e5ebf2"/><text x="181" y="158" class="ink title">种子信息</text><text x="181" y="190" class="ink label">电影 A · HDHome</text><text x="181" y="216" class="muted small">当前状态：等待推送　·　可修改下载器和保存位置。</text><text x="181" y="276" class="ink title">下载器</text><text x="181" y="314" class="ink label">选择下载器<tspan fill="#e05263"> *</tspan></text><rect x="181" y="326" width="360" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="2"/><text x="193" y="352" class="ink small">NAS 主下载器</text><text x="517" y="353" class="blue title">⌃</text><rect x="181" y="372" width="360" height="112" rx="10" fill="#fff" stroke="#bcd3fb"/><rect x="189" y="380" width="318" height="38" rx="7" fill="#eaf2ff"/><text x="205" y="405" class="blue label">✓　NAS 主下载器</text><rect x="189" y="418" width="318" height="38" rx="7" fill="#fff"/><text x="205" y="443" class="ink label">家庭下载器</text><text x="590" y="314" class="ink label">任务保存位置</text><rect x="590" y="326" width="360" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="602" y="352" class="ink small">/downloads/movies</text><text x="181" y="530" class="muted small">保存只更新该条记录；点击“推送”才会真正推送到下载器。</text><text x="181" y="598" class="ink title">已推送 / 正在运行的锁定状态</text><rect x="181" y="622" width="769" height="60" rx="10" fill="#fff7ed" stroke="#f1d7ad"/><text x="200" y="650" class="orange label">种子已在下载器中运行，下载器与保存位置不可修改。</text><text x="200" y="672" class="muted small">请先在列表或详情中执行“删除下载器任务”。</text><text x="181" y="730" class="ink label">选择下载器</text><rect x="181" y="742" width="360" height="40" rx="8" fill="#f1f5f9" stroke="#dce5ee" stroke-width="1"/><text x="193" y="768" class="muted small">NAS 主下载器（锁定）</text><text x="517" y="769" class="muted title">⌄</text><text x="590" y="730" class="ink label">任务保存位置</text><rect x="590" y="742" width="360" height="40" rx="8" fill="#f1f5f9" stroke="#dce5ee" stroke-width="1"/><text x="602" y="768" class="muted small">/downloads/movies</text><text x="181" y="834" class="ink title">删除条件表单</text><rect x="181" y="858" width="18" height="18" rx="4" fill="#3478f6" stroke="#3478f6"/><text x="190" y="872" text-anchor="middle" class="white small">✓</text><text x="209" y="871" class="ink small">仅免费下载（已过免费期且未完成）</text><rect x="181" y="894" width="18" height="18" rx="4" fill="#fff" stroke="#b9c6d5"/><text x="209" y="907" class="ink small">免费到期（无视下载进度）</text><text x="181" y="948" class="ink label">低速上传 KB/秒</text><rect x="181" y="960" width="180" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="193" y="986" class="ink small">20</text><text x="392" y="948" class="ink label">持续分钟</text><rect x="392" y="960" width="180" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="404" y="986" class="ink small">30</text><line x1="145" y1="1100" x2="1215" y2="1100" stroke="#e5ebf2"/><text x="181" y="1143" class="muted small">取消</text><rect x="1060" y="1118" width="118" height="42" rx="9" fill="#3478f6"/><text x="1119" y="1145" text-anchor="middle" class="white label">保存</text></g><g transform="translate(1400 44)"><rect width="460" height="1210" rx="24" fill="#f2f5f9"/><rect x="35" width="390" height="1210" rx="24" fill="#fff"/><text x="57" y="48" class="ink title">修改下载器</text><text x="57" y="74" class="muted small">全屏表单</text><text x="57" y="122" class="ink title">修改下载器</text><text x="57" y="148" class="muted small">电影 A · HDHome</text><text x="57" y="192" class="ink label">选择下载器<tspan fill="#e05263"> *</tspan></text><rect x="57" y="204" width="326" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="2"/><text x="69" y="230" class="ink small">NAS 主下载器</text><text x="359" y="231" class="blue title">⌃</text><text x="57" y="274" class="ink label">任务保存位置</text><rect x="57" y="286" width="326" height="40" rx="8" fill="#fff" stroke="#dce5ee" stroke-width="1"/><text x="69" y="312" class="ink small">/downloads/movies</text><text x="57" y="360" class="ink title">已运行时锁定</text><rect x="57" y="378" width="326" height="66" rx="10" fill="#fff7ed"/><text x="72" y="406" class="orange label">下载器任务运行中</text><text x="72" y="430" class="muted small">需先删除任务才能修改设置。</text><text x="57" y="490" class="ink label">选择下载器</text><rect x="57" y="502" width="326" height="40" rx="8" fill="#f1f5f9" stroke="#dce5ee" stroke-width="1"/><text x="69" y="528" class="muted small">NAS 主下载器（锁定）</text><text x="359" y="529" class="muted title">⌄</text><text x="57" y="572" class="ink label">保存位置</text><rect x="57" y="584" width="326" height="40" rx="8" fill="#f1f5f9" stroke="#dce5ee" stroke-width="1"/><text x="69" y="610" class="muted small">/downloads/movies</text><rect x="35" y="760" width="390" height="290" rx="20" fill="#fff" stroke="#dce5ee"/><text x="59" y="808" class="ink title">选择下载器</text><rect x="59" y="842" width="318" height="38" rx="7" fill="#eaf2ff"/><text x="75" y="867" class="blue label">✓　NAS 主下载器</text><rect x="59" y="880" width="318" height="38" rx="7" fill="#fff"/><text x="75" y="905" class="ink label">家庭下载器</text><text x="59" y="938" class="muted small">没有启用下载器时，选择框禁用并给出跳转提示。</text></g></svg>