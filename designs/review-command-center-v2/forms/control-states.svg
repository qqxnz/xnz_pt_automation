<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220">
<style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#142033}.muted{fill:#718096}.white{fill:#fff}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.tiny{font-size:10px;letter-spacing:1px}.small{font-size:12px}.label{font-size:13px;font-weight:700}.title{font-size:18px;font-weight:800}.value{font-size:24px;font-weight:800}</style>
<rect width="1900" height="1220" fill="#e7edf4"/><text x="20" y="25" class="muted tiny">桌面端控件规范</text><text x="1400" y="25" class="muted tiny">移动端控件规范</text>
<g transform="translate(0 44)"><rect width="1360" height="1150" rx="18" fill="#f2f5f9"/><text x="42" y="54" class="muted tiny">FORM CONTROL SYSTEM</text><text x="42" y="92" class="ink value">选择框、下拉菜单与校验状态</text><text x="42" y="120" class="muted small">用于站点浏览分类、任务站点/下载器/排序规则、种子下载器设置；统一替换桌面原生 select 与移动端选择器的视觉。</text>
<rect x="42" y="150" width="610" height="350" rx="16" fill="#fff" stroke="#e5ebf2"/><text x="66" y="188" class="ink title">单选选择框</text><text x="66" y="216" class="muted small">标签、必填标识、帮助文本和错误信息始终占固定空间。</text><text x="66" y="260" class="ink label">站点 <tspan fill="#e05263">*</tspan></text><rect x="66" y="274" width="400" height="42" rx="9" fill="#fff" stroke="#3478f6" stroke-width="2"/><text x="82" y="301" class="ink small">MTeam</text><text x="438" y="301" class="blue title">⌄</text><text x="66" y="340" class="muted small">已选站点用于限制抓取范围。</text><text x="66" y="388" class="ink label">排序规则</text><rect x="66" y="402" width="400" height="42" rx="9" fill="#fff" stroke="#dce5ee"/><text x="82" y="429" class="muted small">不排序（按抓取顺序）</text><text x="408" y="429" class="muted small">×</text><text x="438" y="429" class="blue title">⌄</text><text x="66" y="468" class="muted small">仅可清空的字段显示 ×；任务站点与下载器不可清空。</text>
<rect x="678" y="150" width="640" height="498" rx="16" fill="#fff" stroke="#e5ebf2"/><text x="702" y="188" class="ink title">展开的下拉菜单</text><text x="702" y="216" class="muted small">当前项目不需要搜索；选项数量较多时菜单内部滚动，最多展示 6 项。</text><rect x="702" y="244" width="390" height="42" rx="9" fill="#fff" stroke="#3478f6" stroke-width="2"/><text x="718" y="271" class="ink small">MTeam</text><text x="1064" y="271" class="blue title">⌃</text><rect x="702" y="292" width="390" height="252" rx="10" fill="#fff" stroke="#bcd3fb"/><rect x="710" y="302" width="374" height="38" rx="7" fill="#eaf2ff"/><text x="728" y="327" class="blue label">✓　MTeam</text><text x="728" y="371" class="ink small">HDHome</text><text x="728" y="415" class="ink small">OurBits</text><text x="728" y="459" class="ink small">PTTime</text><text x="728" y="503" class="muted small">更多选项在此区域滚动</text><text x="1118" y="332" class="blue label">选项规范</text><text x="1118" y="365" class="muted small">高度 40px；点击整行选中。</text><text x="1118" y="395" class="muted small">选中项：浅蓝背景 + 对勾。</text><text x="1118" y="425" class="muted small">不可用项：灰字，保留原因提示。</text><text x="1118" y="455" class="muted small">打开时 trigger 使用蓝色描边。</text><text x="1118" y="485" class="muted small">点击外部 / Esc 关闭。</text>
<rect x="42" y="522" width="610" height="286" rx="16" fill="#fff" stroke="#e5ebf2"/><text x="66" y="560" class="ink title">错误、禁用与加载</text><text x="66" y="600" class="ink label">下载器 <tspan fill="#e05263">*</tspan></text><rect x="66" y="614" width="400" height="42" rx="9" fill="#fff" stroke="#e05263" stroke-width="2"/><text x="82" y="641" class="muted small">请选择下载器</text><text x="66" y="681" class="red small">请选择下载器</text><text x="66" y="728" class="ink label">选择下载器</text><rect x="66" y="742" width="400" height="42" rx="9" fill="#f1f5f9" stroke="#e5ebf2"/><text x="82" y="769" class="muted small">种子已在下载器运行，无法修改</text><text x="490" y="769" class="muted title">⌄</text><text x="492" y="728" class="muted small">禁用</text>
<rect x="678" y="668" width="640" height="320" rx="16" fill="#fff" stroke="#e5ebf2"/><text x="702" y="706" class="ink title">任务规则的多选项与开关</text><text x="702" y="736" class="muted small">优惠类型是现有的 checkbox 多选，不用下拉选择器隐藏已选内容。</text><text x="702" y="780" class="ink label">优惠类型（任选其一命中即可）</text><rect x="702" y="798" width="92" height="32" rx="16" fill="#eaf2ff" stroke="#bcd3fb"/><text x="748" y="819" text-anchor="middle" class="blue small">✓ FREE</text><rect x="806" y="798" width="108" height="32" rx="16" fill="#eaf2ff" stroke="#bcd3fb"/><text x="860" y="819" text-anchor="middle" class="blue small">✓ 2X FREE</text><rect x="926" y="798" width="116" height="32" rx="16" fill="#fff" stroke="#dce5ee"/><text x="984" y="819" text-anchor="middle" class="muted small">50% FREE</text><rect x="1054" y="798" width="88" height="32" rx="16" fill="#fff" stroke="#dce5ee"/><text x="1098" y="819" text-anchor="middle" class="muted small">不免费</text><text x="702" y="870" class="ink label">自动执行</text><rect x="802" y="850" width="46" height="26" rx="13" fill="#3478f6"/><circle cx="833" cy="863" r="10" fill="#fff"/><text x="866" y="868" class="muted small">打开后按执行间隔自动运行</text><text x="702" y="930" class="orange small">危险删除规则用独立 fieldset + 说明按钮，避免与普通筛选混淆。</text></g>
<g transform="translate(1390 44)"><rect width="470" height="1150" rx="24" fill="#f2f5f9"/><rect x="40" width="390" height="1150" rx="24" fill="#fff"/><text x="62" y="48" class="ink title">新建任务</text><text x="62" y="74" class="muted small">控件在移动端使用底部选择面板。</text><text x="62" y="120" class="ink label">站点 <tspan fill="#e05263">*</tspan></text><rect x="62" y="134" width="326" height="44" rx="9" fill="#fff" stroke="#3478f6" stroke-width="2"/><text x="78" y="162" class="ink small">MTeam</text><text x="360" y="162" class="blue title">⌄</text><text x="62" y="204" class="muted small">点击后从底部弹出选项，不在页面中间浮层。</text><text x="62" y="248" class="ink label">排序规则</text><rect x="62" y="262" width="326" height="44" rx="9" fill="#fff" stroke="#dce5ee"/><text x="78" y="290" class="muted small">不排序（按抓取顺序）</text><text x="330" y="290" class="muted small">×</text><text x="360" y="290" class="blue title">⌄</text>
<rect x="40" y="548" width="390" height="424" rx="22" fill="#fff" stroke="#dce5ee"/><rect x="185" y="562" width="100" height="4" rx="2" fill="#d4dce6"/><text x="64" y="610" class="ink title">选择站点</text><text x="64" y="638" class="muted small">单选后立即关闭；必填项无清空按钮。</text><rect x="64" y="660" width="342" height="46" rx="9" fill="#eaf2ff"/><text x="82" y="689" class="blue label">✓　MTeam</text><text x="82" y="744" class="ink label">HDHome</text><text x="82" y="792" class="ink label">OurBits</text><text x="82" y="840" class="ink label">PTTime</text><text x="64" y="900" class="muted small">禁用选项显示原因；无可用下载器时 trigger 禁用。</text><rect x="64" y="916" width="342" height="38" rx="9" fill="#fff" stroke="#dce5ee"/><text x="235" y="941" text-anchor="middle" class="blue label">关闭</text><text x="62" y="1020" class="orange small">移动端错误显示在选择框下，不使用 Toast 代替字段校验。</text></g></svg>