<rect x="316" y="582" width="1048" height="178" rx="10" fill="#f8fbff" stroke="#d8e6fa"/><text x="340" y="613" class="blue label">切换分类后的字段映射（不显示分类数量）</text><text x="340" y="646" class="ink small">任务日志：任务名 · 消息 · 任务 ID / 来源自动或手动 / 开始结束 / 抓取、去重、命中、推送统计；失败详情最多 4 条。</text><text x="340" y="677" class="ink small">定时日志：可读任务名 · 消息 · 开始结束 / 耗时 / 摘要 / 错误；details 序列化后显示在失败详情。</text><text x="340" y="708" class="ink small">签到日志：站点名 · 消息 · 自动或手动 / 触发源 / 时间 / 耗时；失败时显示“签到失败：错误”。</text><text x="340" y="739" class="ink small">种子日志：事件名 · 消息 · 站点 / 来源 / 原因 / 操作者；原因存在时显示在失败详情。</text>
<rect x="316" y="790" width="1048" height="80" rx="10" fill="#fff7ed" stroke="#f1d7ad"/><text x="340" y="820" class="orange label">清空与导出规则</text><text x="340" y="847" class="muted small">导出：当前分类的全部记录（CSV，敏感凭证与链接由后端脱敏）；清空：仅当前分类，浏览器原生确认后不可恢复。</text>
<rect x="292" y="920" width="1096" height="48" rx="10" fill="#fff" stroke="#e5ebf2"/><text x="316" y="950" class="muted small">上一页</text><text x="514" y="950" class="muted small">第 1 / 7 页　·　每页固定 20 条</text><text x="784" y="950" class="muted small">下一页</text><text x="1080" y="950" class="muted small">加载中：刷新按钮禁用；请求失败：顶部错误横幅 + 重试</text>
<rect x="292" y="988" width="1096" height="94" rx="14" fill="#fff" stroke="#e5ebf2"/><text x="316" y="1020" class="ink title">空状态</text><text x="316" y="1049" class="muted small">当前分类无记录时显示：“暂无操作日志。”；分类切换会重置到第 1 页并重新加载。</text></g>
