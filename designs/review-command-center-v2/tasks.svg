<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1140" viewBox="0 0 2020 1140"><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#142033}.muted{fill:#718096}.white{fill:#fff}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.tiny{font-size:10px;letter-spacing:1.1px}.small{font-size:12px}.label{font-size:13px;font-weight:700}.title{font-size:18px;font-weight:800}.value{font-size:24px;font-weight:800}.pill{font-size:10px;font-weight:800}</style><rect width="2020" height="1140" fill="#e7edf4"/><text x="20" y="24" class="muted tiny">桌面端 · 任务操作优化</text><text x="1502" y="24" class="muted tiny">移动端 · 任务操作优化</text><g transform="translate(0 40)"><rect width="1440" height="1080" rx="18" fill="#f2f5f9"/><rect width="256" height="1080" rx="18" fill="#111c2e"/><rect x="256" width="1184" height="68" fill="#fff"/><rect x="24" y="22" width="38" height="38" rx="12" fill="#3478f6"/><text x="43" y="48" text-anchor="middle" class="white small" font-weight="800">PT</text><text x="75" y="39" class="white label">PT Automation</text><text x="75" y="55" class="muted small">NAS 运行指挥台</text><text x="26" y="106" class="muted tiny">工作台</text><text x="38" y="142" class="muted label">◈</text><text x="67" y="142" class="muted small">首页概览</text><text x="38" y="186" class="muted label">◉</text><text x="67" y="186" class="muted small">站点</text><rect x="14" y="248" width="228" height="39" rx="9" fill="#203b63"/><text x="38" y="230" class="muted label">⇣</text><text x="67" y="230" class="muted small">下载器</text><text x="38" y="274" class="blue label">✓</text><text x="67" y="274" class="white small">任务</text><text x="38" y="318" class="muted label">◇</text><text x="67" y="318" class="muted small">种子</text><text x="38" y="362" class="muted label">⌁</text><text x="67" y="362" class="muted small">流量</text><text x="38" y="406" class="muted label">≡</text><text x="67" y="406" class="muted small">日志</