  <text x="292" y="106" fill="#718096" class="tiny">运行指挥台</text><text x="292" y="141" class="ink" font-size="30" font-weight="800">早上好，系统运行稳定</text><text x="292" y="166" class="muted" font-size="14">集中查看 PT 站点、下载器和自动化任务的实时状态。</text><text x="1162" y="134" class="muted small">最近更新：10:28</text><rect x="1300" y="112" width="88" height="40" rx="10" fill="#3478f6"/><text x="1344" y="138" class="white label" text-anchor="middle">刷新</text>
