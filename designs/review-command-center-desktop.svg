<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.small{font-size:12px}.tiny{font-size:10px;letter-spacing:1.3px}.muted{fill:#718096}.white{fill:#fff}.ink{fill:#142033}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.card{fill:#fff;stroke:#e5ebf2}.label{font-size:13px;font-weight:700}.title{font-size:18px;font-weight:800}.value{font-size:26px;font-weight:800}.nav{font-size:14px;font-weight:650}
