      <rect x="28" y="370" width="1024" height="60" rx="18" fill="#f8fafc"/><text x="52" y="406" class="t muted small">站点默认不使用代理；站点只能选择已启用代理。删除被站点引用的代理前需要先解绑。</text>
    </g>
    <g transform="translate(0 720)" filter="url(#card)"><rect width="1080" height="108" rx="24" fill="#fff"/><text x="28" y="44" class="t dark label">新增 / 编辑表单</text><text x="28" y="76" class="t muted small">名称、类型、Host、端口、用户名、密码、启用状态。密码脱敏展示，留空表示不修改。</text></g>
