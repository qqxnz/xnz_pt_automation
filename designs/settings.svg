<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="card" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.08"/></filter><style>.t{font-family:Inter,Arial,sans-serif}.dark{fill:#111827}.muted{fill:#6b7280}.small{font-size:14px}.xs{font-size:12px}.label{font-size:16px;font-weight:700}.h1{font-size:30px;font-weight:800}</style></defs>
  <rect width="1440" height="960" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#fff"/><rect y="71" width="1440" height="1" fill="#e5e7eb"/>
  <rect x="32" y="18" width="36" height="36" rx="10" fill="#3f7cff"/><path d="M44 42h12M44 32h20M56 22h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="84" y="43" class="t dark" font-size="20" font-weight="800">PT Automation</text><text x="1210" y="43" class="t muted small">admin</text><text x="1270" y="43" class="t muted small">系统设置</text><text x="1350" y="43" class="t muted small">退出</text>
  <rect x="0" y="72" width="232" height="888" fill="#fff"/><rect x="231" y="72" width="1" height="888" fill="#e5e7eb"/>
  <g class="t" font-size="15"><text x="56" y="144" fill="#374151">Dashboard</text><text x="56" y="204" fill="#374151">站点</text><text x="56" y="260" fill="#374151">种子</text><text x="56" y="316" fill="#374151">下载器</text><text x="56" y="372" fill="#374151">代理管理</text><text x="56" y="428" fill="#374151">任务</text><text x="56" y="484" fill="#374151">日志</text><rect x="24" y="512" width="184" height="44" rx="12" fill="#eff6ff"/><text x="56" y="540" fill="#2563eb" font-weight="800">系统设置</text></g>
  <g transform="translate(280 112)">
    <text x="0" y="0" class="t dark h1">系统设置</text><text x="0" y="34" class="t muted" font-size="16">修改密码、查看系统信息、配置会话、网络和数据保留参数</text><rect x="932" y="-28" width="148" height="46" rx="14" fill="#eef6ff"/><text x="1006" y="1" text-anchor="middle" fill="#2563eb" class="t" font-size="16" font-weight="800">刷新信息</text>
    <g transform="translate(0 78)" filter="url(#card)"><rect width="520" height="258" rx="28" fill="#fff"/>
      <text x="28" y="42" class="t dark label">修改密码</text><rect x="346" y="20" width="146" height="34" rx="17" fill="#fff7ed"/><text x="419" y="42" text-anchor="middle" fill="#b45309" class="t xs" font-weight="800">默认密码风险</text>
      <text x="28" y="82" class="t muted xs">旧密码</text><rect x="28" y="94" width="214" height="42" rx="12" fill="#fff" stroke="#d1d5db"/><text x="44" y="120" class="t muted xs">••••••••</text><text x="266" y="82" class="t muted xs">新密码</text><rect x="266" y="94" width="226" height="42" rx="12" fill="#fff" stroke="#d1d5db"/><text x="282" y="120" class="t muted xs">8-64 位，含字母和数字</text>
      <text x="28" y="158" class="t muted xs">确认新密码</text><rect x="28" y="170" width="300" height="42" rx="12" fill="#fff" stroke="#d1d5db"/><rect x="348" y="170" width="144" height="42" rx="14" fill="#3f7cff"/><text x="420" y="197" text-anchor="middle" fill="#fff" class="t small" font-weight="800">保存密码</text>
      <text x="28" y="236" class="t muted small">保存后当前会话继续有效，其他会话失效；密码不会进入日志。</text>
    </g>
    <g transform="translate(560 78)" filter="url(#card)"><rect width="520" height="258" rx="28" fill="#fff"/>
      <text x="28" y="42" class="t dark label">系统信息</text><rect x="396" y="20" width="96" height="34" rx="17" fill="#dcfce7"/><text x="444" y="42" text-anchor="middle" fill="#15803d" class="t xs" font-weight="800">运行正常</text>
      <text x="28" y="82" class="t muted xs">系统版本</text><text x="164" y="82" class="t dark small" font-weight="800">v0.1.0</text><text x="288" y="82" class="t muted xs">运行环境</text><text x="404" y="82" class="t dark small">production</text><line x1="28" y1="104" x2="492" y2="104" stroke="#e5e7eb"/>
      <text x="28" y="132" class="t muted xs">数据库路径</text><text x="164" y="132" class="t dark small">/app/data/app.db</text><text x="404" y="132" class="t muted xs">42 MB</text><line x1="28" y1="154" x2="492" y2="154" stroke="#e5e7eb"/>
      <text x="28" y="182" class="t muted xs">Schema</text><text x="164" y="182" class="t dark small" font-weight="800">2026060301</text><text x="288" y="182" class="t muted xs">最近迁移</text><rect x="404" y="162" width="64" height="28" rx="14" fill="#dcfce7"/><text x="436" y="181" text-anchor="middle" fill="#15803d" class="t xs" font-weight="800">成功</text><line x1="28" y1="204" x2="492" y2="204" stroke="#e5e7eb"/>
      <text x="28" y="232" class="t muted xs">启动时间</text><text x="164" y="232" class="t dark small">2026-06-05 09:20</text><text x="348" y="232" class="t muted xs">Asia/Shanghai</text>
    </g>
    <g transform="translate(0 372)" filter="url(#card)"><rect width="1080" height="342" rx="28" fill="#fff"/>
      <text x="28" y="42" class="t dark label">基础参数</text><text x="916" y="42" fill="#2563eb" class="t small" font-weight="800">保存设置</text><text x="1000" y="42" class="t muted small" font-weight="800">重置</text>
      <text x="28" y="82" class="t muted small" font-weight="800">会话</text><rect x="28" y="100" width="238" height="72" rx="18" fill="#f8fafc"/><text x="48" y="130" class="t muted xs">登录态有效期</text><text x="48" y="158" class="t dark label">168 小时</text><text x="170" y="158" class="t muted xs">1-720</text>
      <text x="298" y="82" class="t muted small" font-weight="800">数据保留</text><rect x="298" y="100" width="238" height="72" rx="18" fill="#f8fafc"/><text x="318" y="130" class="t muted xs">操作日志</text><text x="318" y="158" class="t dark label">180 天</text><text x="422" y="158" class="t muted xs">7-3650</text><rect x="558" y="100" width="238" height="72" rx="18" fill="#f8fafc"/><text x="578" y="130" class="t muted xs">任务日志</text><text x="578" y="158" class="t dark label">60 天</text><text x="676" y="158" class="t muted xs">7-3650</text><rect x="818" y="100" width="234" height="72" rx="18" fill="#f8fafc"/><text x="838" y="130" class="t muted xs">种子记录</text><text x="838" y="158" class="t dark label">365 天</text><text x="944" y="158" class="t muted xs">30-3650</text>
      <text x="28" y="216" class="t muted small" font-weight="800">网络</text><rect x="28" y="234" width="238" height="72" rx="18" fill="#f8fafc"/><text x="48" y="264" class="t muted xs">请求超时时间</text><text x="48" y="292" class="t dark label">15000 ms</text><text x="158" y="292" class="t muted xs">3-120 秒</text><rect x="298" y="234" width="498" height="72" rx="18" fill="#f8fafc"/><text x="318" y="264" class="t muted xs">代理测试目标 URL</text><text x="318" y="292" class="t dark small">https://www.gstatic.com/generate_204</text><rect x="818" y="234" width="234" height="72" rx="18" fill="#f8fafc"/><text x="838" y="264" class="t muted xs">最大并发任务数</text><text x="838" y="292" class="t dark label">2</text><text x="888" y="292" class="t muted xs">1-10</text>
    </g>
    <g transform="translate(0 750)" filter="url(#card)"><rect width="520" height="112" rx="24" fill="#fff"/>
      <text x="28" y="42" class="t dark label">默认 User-Agent</text><rect x="28" y="58" width="464" height="34" rx="12" fill="#f8fafc"/><text x="48" y="80" class="t muted xs">Mozilla/5.0 ... 新增站点时作为默认值，不覆盖已有站点。</text>
    </g>
    <g transform="translate(560 750)" filter="url(#card)"><rect width="520" height="112" rx="24" fill="#fff"/>
      <text x="28" y="42" class="t dark label">安全提示</text><text x="28" y="72" class="t muted small">系统信息不展示密钥类环境变量，也不提供数据库下载。</text><text x="28" y="96" class="t muted xs">移动端单列排列，保存按钮在有修改时固定到底部。</text>
    </g>
  </g>
</svg>
