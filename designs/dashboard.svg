      <rect x="28" y="76" width="468" height="34" rx="17" fill="#eef2f7"/><rect x="28" y="76" width="351" height="34" rx="17" fill="#10b981"/><rect x="379" y="76" width="78" height="34" fill="#f59e0b"/><rect x="457" y="76" width="39" height="34" rx="17" fill="#ef4444"/>
      <text x="28" y="146" class="t dark label">在线 9</text><text x="158" y="146" class="t dark label">认证失败 2</text><text x="328" y="146" class="t dark label">离线 1</text>
      <rect x="28" y="184" width="468" height="64" rx="18" fill="#fff7ed"/><text x="54" y="224" fill="#b45309" class="t" font-size="16" font-weight="800">HDHome 认证失败，请更新访问凭证</text>
