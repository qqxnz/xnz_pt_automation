      <line x1="28" y1="118" x2="1052" y2="118" stroke="#e5e7eb"/>
      <text x="28" y="154" class="t muted label">sync-site-traffic</text><text x="302" y="154" fill="#10b981" class="t label">成功</text><text x="420" y="154" class="t muted small">更新 12 个站点上传下载统计</text><text x="928" y="154" class="t muted small">10:00</text>
    </g>
