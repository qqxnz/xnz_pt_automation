    <style>.t{font-family:Inter,Arial,sans-serif}.muted{fill:#6b7280}.dark{fill:#111827}.small{font-size:14px}.label{font-size:16px;font-weight:700}.h1{font-size:30px;font-weight:800}.nav{font-size:15px}</style>
  </defs>
  <rect width="1440" height="960" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#fff"/>
