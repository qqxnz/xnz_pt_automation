<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="card" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.08"/></filter><style>.t{font-family:Inter,Arial,sans-serif}.dark{fill:#111827}.muted{fill:#6b7280}.small{font-size:14px}.label{font-size:16px;font-weight:700}.h1{font-size:30px;font-weight:800}</style></defs>
  <rect width="1440" height="960" fill="#f6f8fb"/>
  <rect width="1440" height="72" fill="#fff"/><rect y="71" width="1440" height="1" fill="#e5e7eb"/>
  <rect x="32" y="18" width="36" height="36" rx="10" fill="#3f7cff"/><path d="M44 42h12M44 32h20M56 22h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="84" y="43" class="t dark" font-size="20" font-weight="800">PT Automation</text><text x="1210" y="43" class="t muted small">admin</text><text x="1270" y="43" class="t muted small">系统设置</text><text x="1350" y="43" class="t muted small">退出</text>
  <rect x="0" y="72" width="232" height="888" fill="#fff"/><rect x="231" y="72" width="1" height="888" fill="#e5e7eb"/>
  <g class="t" font-size="15"><text x="56" y="144" fill="#374151">Dashboard</text><text x="56" y="204" fill="#374151">站点</text><text x="56" y="260" fill="#374151">种子</text><text x="56" y="316" fill="#374151">下载器</text><text x="56" y="372" fill="#374151">代理管理</text><rect x="24" y="400" width="184" height="44" rx="12" fill="#eff6ff"/><text x="56" y="428" fill="#2563eb" font-weight="800">任务</text><text x="56" y="484" fill="#374151">系统设置</text></g>
  <g transform="translate(280 112)">
    <text x="0" y="0" class="t dark h1">任务</text><text x="0" y="34" class="t muted" font-size="16">创建抓取推送任务，控制运行、日志和调度状态</text><rect x="908" y="-28" width="172" height="46" rx="14" fill="#3f7cff"/><text x="994" y="1" text-anchor="middle" fill="#fff" class="t" font-size="16" font-weight="800">新建任务</text>
    <g transform="translate(0 78)" filter="url(#card)"><rect width="1080" height="96" rx="24" fill="#fff"/>
      <rect x="24" y="24" width="280" height="48" rx="14" fill="#f9fafb" stroke="#e5e7eb"/><text x="44" y="54" class="t muted small">搜索任务 / 站点 / 下载器</text>
      <rect x="324" y="24" width="148" height="48" rx="14" fill="#f9fafb" stroke="#e5e7eb"/><text x="344" y="54" class="t dark small">状态：全部</text>
      <rect x="492" y="24" width="154" height="48" rx="14" fill="#f9fafb" stroke="#e5e7eb"/><text x="512" y="54" class="t dark small">运行：全部</text>
      <rect x="666" y="24" width="154" height="48" rx="14" fill="#f9fafb" stroke="#e5e7eb"/><text x="686" y="54" class="t dark small">自动推送：全部</text>
      <rect x="942" y="24" width="114" height="48" rx="14" fill="#eef6ff"/><text x="999" y="54" text-anchor="middle" fill="#2563eb" class="t small" font-weight="800">刷新</text>
    </g>
    <g transform="translate(0 210)" filter="url(#card)"><rect width="1080" height="382" rx="28" fill="#fff"/>
      <text x="28" y="44" class="t muted small" font-weight="800">任务名称</text><text x="260" y="44" class="t muted small" font-weight="800">站点</text><text x="370" y="44" class="t muted small" font-weight="800">下载器</text><text x="500" y="44" class="t muted small" font-weight="800">间隔</text><text x="596" y="44" class="t muted small" font-weight="800">范围</text><text x="704" y="44" class="t muted small" font-weight="800">最近结果</text><text x="890" y="44" class="t muted small" font-weight="800">操作</text><line x1="28" y1="64" x2="1052" y2="64" stroke="#e5e7eb"/>
      <text x="28" y="112" class="t dark label">MTeam 免费自动推送</text><text x="260" y="112" class="t dark small">MTeam</text><text x="370" y="112" class="t dark small">NAS QB</text><text x="500" y="112" class="t dark small">30 分钟</text><rect x="596" y="90" width="76" height="30" rx="15" fill="#dcfce7"/><text x="634" y="110" text-anchor="middle" fill="#15803d" class="t" font-size="13" font-weight="800">免费</text><rect x="704" y="90" width="74" height="30" rx="15" fill="#dcfce7"/><text x="741" y="110" text-anchor="middle" fill="#15803d" class="t" font-size="13" font-weight="800">成功</text><text x="798" y="112" class="t muted small">10:20 抓取 12 个</text><text x="890" y="112" fill="#2563eb" class="t small" font-weight="800">运行</text><text x="948" y="112" fill="#2563eb" class="t small" font-weight="800">编辑</text><text x="1006" y="112" fill="#6b7280" class="t small" font-weight="800">日志</text>
      <line x1="28" y1="144" x2="1052" y2="144" stroke="#e5e7eb"/>
      <text x="28" y="192" class="t dark label">HDHome 只抓不推</text><text x="260" y="192" class="t dark small">HDHome</text><text x="370" y="192" class="t dark small">NAS QB</text><text x="500" y="192" class="t dark small">60 分钟</text><rect x="596" y="170" width="86" height="30" rx="15" fill="#eef2ff"/><text x="639" y="190" text-anchor="middle" fill="#4338ca" class="t" font-size="13" font-weight="800">FREE+</text><rect x="704" y="170" width="74" height="30" rx="15" fill="#fef2f2"/><text x="741" y="190" text-anchor="middle" fill="#b91c1c" class="t" font-size="13" font-weight="800">失败</text><text x="798" y="192" class="t muted small">代理已禁用</text><text x="890" y="192" fill="#2563eb" class="t small" font-weight="800">运行</text><text x="948" y="192" fill="#2563eb" class="t small" font-weight="800">编辑</text><text x="1006" y="192" fill="#6b7280" class="t small" font-weight="800">日志</text>
      <line x1="28" y1="224" x2="1052" y2="224" stroke="#e5e7eb"/>
      <text x="28" y="272" class="t dark label">PTP 手动筛选</text><text x="260" y="272" class="t dark small">PTP</text><text x="370" y="272" class="t dark small">Backup QB</text><text x="500" y="272" class="t dark small">120 分钟</text><rect x="596" y="250" width="76" height="30" rx="15" fill="#f3f4f6"/><text x="634" y="270" text-anchor="middle" fill="#374151" class="t" font-size="13" font-weight="800">全部</text><rect x="704" y="250" width="86" height="30" rx="15" fill="#f3f4f6"/><text x="747" y="270" text-anchor="middle" fill="#6b7280" class="t" font-size="13" font-weight="800">未运行</text><text x="890" y="272" fill="#2563eb" class="t small" font-weight="800">运行</text><text x="948" y="272" fill="#2563eb" class="t small" font-weight="800">编辑</text><text x="1006" y="272" fill="#6b7280" class="t small" font-weight="800">日志</text>
      <rect x="28" y="310" width="1024" height="44" rx="16" fill="#f8fafc"/><text x="52" y="338" class="t muted small">运行时复用站点保存的 User-Agent 和可选代理；同一任务运行中不可重复启动。</text>
    </g>
    <g transform="translate(0 628)" filter="url(#card)"><rect width="520" height="228" rx="28" fill="#fff"/><text x="28" y="44" class="t dark label">新增 / 编辑任务</text><text x="28" y="82" class="t muted small">任务名称、站点、下载器、执行间隔、只抓免费、自动推送、优惠类型、即将过期阈值。</text><rect x="28" y="118" width="464" height="58" rx="16" fill="#f8fafc"/><text x="52" y="153" class="t dark small">保存路径覆盖 / 分类覆盖 / 标签覆盖 / 添加后暂停</text></g>
    <g transform="translate(560 628)" filter="url(#card)"><rect width="520" height="228" rx="28" fill="#fff"/><text x="28" y="44" class="t dark label">任务日志抽屉</text><text x="28" y="84" class="t dark small">10:20 成功 抓取 12 个，推送 8 个</text><text x="28" y="124" class="t dark small">09:50 失败 代理已禁用</text><text x="28" y="164" class="t muted small">日志自动脱敏 Cookie、密钥、密码和下载链接。</text></g>
