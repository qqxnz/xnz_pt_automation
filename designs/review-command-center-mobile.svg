  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{font-size:9px;letter-spacing:1px}.small{font-size:11px}.muted{fill:#718096}.ink{fill:#142033}.white{fill:#fff}.blue{fill:#3478f6}.green{fill:#14a675}.orange{fill:#ef9b26}.red{fill:#e05263}.label{font-size:12px;font-weight:700}.value{font-size:21px;font-weight:800}</style>
